basePath: /api/proxy
definitions:
  controller.CaptchaRequest:
    properties:
      ip:
        type: string
    required:
    - ip
    type: object
  model.AccessLog:
    properties:
      id: {}
      ip:
        type: string
      latency:
        type: integer
      level:
        description: 'Например: "info", "warning", "error"'
        type: string
      method:
        type: string
      reason:
        description: 'Например: "Blacklisted by administrator"'
        type: string
      requestID:
        description: Уникальный ID для отслеживания запроса
        type: string
      statusCode:
        type: integer
      timestamp:
        type: string
      url:
        type: string
    type: object
  model.IPRule:
    properties:
      burst:
        description: максимальный всплеск
        type: integer
      comment:
        description: Для чего это правило (необязательно, но полезно)
        type: string
      id:
        type: string
      network:
        description: 'Например: "192.168.1.0/24"'
        type: string
      rate:
        description: количество запросов в секунду
        type: number
      type:
        description: '"white", "black", "grey"'
        type: string
      updatedAt:
        type: string
    type: object
  service.ClientStats:
    properties:
      blocked_blacklist:
        description: Забанен по IP
        type: integer
      blocked_rate_limit:
        description: Превысил лимит RPS/RPM
        type: integer
      blocked_requests:
        type: integer
      bytes_transferred:
        type: integer
      ip:
        type: string
      total_requests:
        type: integer
    type: object
host: localhost:9000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Пример сервера для документации
  license:
    name: Apache 2.0
    url: http://apache.org
  termsOfService: http://swagger.io/terms/
  title: Swagger Example API
  version: "1.0"
paths:
  /management/cache:
    delete:
      description: Удаляет все записи из кеша в памяти
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Очистить кеш
      tags:
      - Cache-Management
  /management/cache_setting/{id}:
    get:
      description: Возвращает настройки кеша для указанного ObjectID
      parameters:
      - description: ObjectID настройки
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить настройки кеша по ID
      tags:
      - Cache-Management
  /management/cache_settings/{id}:
    delete:
      description: Удаляет настройку кеша для указанного ObjectID
      parameters:
      - description: ObjectID настройки
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Удалить настройку кеша по ID
      tags:
      - Cache-Management
    put:
      consumes:
      - application/json
      description: Изменяет ttl у опредленной настройки кеша по id
      parameters:
      - description: ID настройки кеша (Hex)
        in: path
        name: id
        required: true
        type: string
      - description: Новое значение TTL в JSON
        in: body
        name: ttl_request
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Изменить TTL настройки кеша по id
      tags:
      - Cache-Management
  /management/cache_settings/purge:
    delete:
      description: Удаляет весь кеш для совпадений по началу пути (например, /api/users.
        Удалит в том числе /api/users/uuid)
      parameters:
      - description: Путь для удаления настроек
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Удалить кеш по началу пути
      tags:
      - Cache-Management
  /management/clients:
    get:
      description: Возвращает список самых активных IP-адресов с сортировкой по количеству
        запросов и логами блокировок
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/service.ClientStats'
              type: array
            type: object
      summary: Получить топ активных клиентов и нарушителей
      tags:
      - Monitoring
  /management/ip_access/verify-captcha:
    post:
      consumes:
      - application/json
      description: Проверяет запрос от фронтенда и выставляет сессионную куку доверия
        для IP
      parameters:
      - description: Данные верификации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controller.CaptchaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Подтвердить прохождение капчи
      tags:
      - Security
  /management/logs:
    get:
      description: Возвращает последние 100 структурированных JSON-логов из MongoDB
        с возможностью фильтрации по уровню и IP
      parameters:
      - description: Фильтр по уровню логов (DEBUG, INFO, WARN, ERROR)
        in: query
        name: level
        type: string
      - description: Фильтр по IP-адресу клиента
        in: query
        name: ip
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/model.AccessLog'
              type: array
            type: object
        "500":
          description: 'error: Не удалось прочитать логи из БД'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить асинхронные логи аудита
      tags:
      - Monitoring
  /management/metrics:
    get:
      description: Возвращает историю RPS, задержки и трафика за последние 60 секунд
        для графиков
      produces:
      - application/json
      responses: {}
      summary: Получить динамические метрики
      tags:
      - Monitoring
  /management/reload:
    get:
      description: Обновляет актуальные правила IP
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Подгрузить правила IP
      tags:
      - IP-Management
  /management/rules:
    get:
      description: Возвращает список всех правил IP
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.IPRule'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить все правила IP
      tags:
      - IP-Management
    post:
      consumes:
      - application/json
      description: Добавляет новый IP в черный, белый или серый список
      parameters:
      - description: Данные правила
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.IPRule'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Добавить правило IP
      tags:
      - IP-Management
  /management/rules/{id}:
    delete:
      description: Удаляет запись из MongoDB по её ObjectID
      parameters:
      - description: ObjectID правила
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Удалить правило IP
      tags:
      - IP-Management
swagger: "2.0"
